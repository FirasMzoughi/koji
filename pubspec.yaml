name: koji
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  uuid: ^4.2.2
  flutter_riverpod: ^2.4.9
  go_router: ^12.0.0
  logger: ^2.0.0
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  flutter_svg: ^2.0.10
  flutter_launcher_icons: "^0.14.3"
  image_cropper: ^8.0.0
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.3
  share_plus: ^10.1.2
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Local fonts to reduce APK size (replaces google_fonts package)
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/LOGO.png"
  min_sdk_android: 21
  remove_alpha_ios: true
 # android min sdk min:16, default 21